[project]
name = "quantlab"
version = "0.1.0"
description = "Personal quantitative research and backtesting stack"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.6",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "pyarrow>=26.0.0",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    "quantstats>=0.0.86",
    "scikit-learn>=1.9.1",
    "statsmodels>=0.15.0",
    "yfinance>=1.7.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
    "vectorbt>=1.1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["quantlab"]

[project.scripts]
quantlab = "quantlab.cli:main"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not network'"
markers = ["network: tests hitting external APIs (deselected by default)"]
